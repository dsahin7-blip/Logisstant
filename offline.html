<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0b1f45">
  <title>Logisstant · Bağlantı yok</title>
  <style>
    :root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#0f172a;background:#f1f5f9}
    *{box-sizing:border-box}body{min-height:100vh;margin:0;display:grid;place-items:center;padding:24px}
    main{max-width:440px;padding:32px;border-radius:24px;background:#fff;box-shadow:0 16px 48px #0f172a18;text-align:center}
    .mark{width:64px;height:64px;margin:0 auto 20px;display:grid;place-items:center;border-radius:18px;background:#0b1f45;color:#fff;font-size:24px;font-weight:800}
    h1{font-size:22px;margin:0 0 12px}p{margin:0;color:#475569;line-height:1.6}
    button{margin-top:24px;border:0;border-radius:12px;padding:12px 20px;background:#2563eb;color:#fff;font-weight:700;font-size:14px;cursor:pointer}
    @media(prefers-color-scheme:dark){:root{color:#f8fafc;background:#020617}main{background:#0f172a}p{color:#cbd5e1}}
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">L</div>
    <h1 id="title">İnternet bağlantısı yok</h1>
    <p id="message">Logisstant kayıtlarınızı güvenli şekilde gösterebilmek için internet bağlantısı gerektirir. Bağlantınızı kontrol edip tekrar deneyin.</p>
    <button id="retry" type="button" onclick="location.reload()">Tekrar dene</button>
  </main>
  <script>
    if (navigator.language && !navigator.language.toLowerCase().startsWith('tr')) {
      document.documentElement.lang = 'en';
      document.title = 'Logisstant · No connection';
      document.getElementById('title').textContent = 'No internet connection';
      document.getElementById('message').textContent = 'Logisstant needs an internet connection to securely show your records. Check your connection and try again.';
      document.getElementById('retry').textContent = 'Try again';
    }
  </script>
</body>
</html>
