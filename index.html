<!DOCTYPE html>
<html lang="tr" x-data="appData()" :class="{ 'dark': darkMode }">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lojistik Asistanı</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- HTML to PDF Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body class="bg-slate-100 dark:bg-slate-950 text-slate-800 dark:text-slate-100 font-sans antialiased min-h-screen flex flex-col transition-colors duration-200">

    <!-- 1. GİRİŞ (LOGIN) EKRANI -->
    <div x-show="!isLoggedIn" class="flex-grow flex items-center justify-center p-4 bg-gradient-to-br from-blue-950 via-slate-900 to-blue-900" x-cloak>
        <div class="bg-white dark:bg-slate-900 rounded-3xl p-8 max-w-md w-full shadow-2xl border border-blue-900/20 space-y-6">
            <div class="text-center space-y-2">
                <h1 class="text-2xl font-bold tracking-tight text-blue-950 dark:text-white" x-text="t('brand')"></h1>
                <p class="text-xs text-slate-500" x-text="t('loginSubtitle')"></p>
            </div>

            <!-- Giriş Sekmeleri -->
            <div class="flex bg-slate-100 dark:bg-slate-800 p-1 rounded-xl text-sm font-medium">
                <button @click="loginType = 'firm'" :class="loginType === 'firm' ? 'bg-blue-600 text-white shadow' : 'text-slate-600 dark:text-slate-400'" class="flex-1 py-2 rounded-lg transition" x-text="t('firmLogin')"></button>
                <button @click="loginType = 'client'" :class="loginType === 'client' ? 'bg-blue-600 text-white shadow' : 'text-slate-600 dark:text-slate-400'" class="flex-1 py-2 rounded-lg transition" x-text="t('clientLogin')"></button>
            </div>

            <div class="space-y-4">
                <div>
                    <label class="text-xs font-semibold text-slate-600 dark:text-slate-400" x-text="t('emailLabel')"></label>
                    <input type="email" x-model="loginEmail" placeholder="ornek@sirket.com" class="w-full mt-1 p-3 border rounded-xl dark:bg-slate-800 dark:border-slate-700 text-sm focus:ring-2 focus:ring-blue-600 focus:outline-none">
                </div>
                <div>
                    <label class="text-xs font-semibold text-slate-600 dark:text-slate-400" x-text="t('passLabel')"></label>
                    <input type="password" placeholder="••••••••" class="w-full mt-1 p-3 border rounded-xl dark:bg-slate-800 dark:border-slate-700 text-sm focus:ring-2 focus:ring-blue-600 focus:outline-none">
                </div>

                <button @click="handleLogin()" class="w-full bg-blue-600 hover:bg-blue-500 text-white py-3 rounded-xl font-bold text-sm shadow-lg transition" x-text="loginType === 'firm' ? t('firmBtn') : t('clientBtn')"></button>
            </div>

            <!-- Hızlı Test Girişleri -->
            <div class="border-t border-slate-200 dark:border-slate-800 pt-4 space-y-2">
                <p class="text-[11px] text-center text-slate-400 uppercase tracking-wider font-bold" x-text="t('quickTest')"></p>
                <div class="grid grid-cols-2 gap-2">
                    <button @click="quickLogin('admin')" class="bg-blue-50 dark:bg-blue-950/50 text-blue-700 dark:text-blue-300 hover:bg-blue-100 p-2 rounded-xl text-xs font-semibold transition" x-text="t('adminFast')"></button>
                    <button @click="quickLogin('client')" class="bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 hover:bg-slate-200 p-2 rounded-xl text-xs font-semibold transition" x-text="t('clientFast')"></button>
                </div>
            </div>
        </div>
    </div>

    <!-- 2. ANA UYGULAMA -->
    <div x-show="isLoggedIn" class="flex-grow flex flex-col" x-cloak>
        <!-- Header / Navbar -->
        <header class="bg-blue-950 dark:bg-slate-900 text-white shadow-lg border-b border-blue-900/50">
            <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
                <div class="flex items-center space-x-3">
                    <span class="text-2xl font-bold tracking-tight" x-text="t('brand')"></span>
                </div>
                
                <div class="flex items-center space-x-3">
                    <!-- Dil Seçici (TR / EN) -->
                    <select x-model="language" class="bg-blue-900 dark:bg-slate-800 text-white text-xs px-2.5 py-2 rounded-lg font-semibold focus:outline-none cursor-pointer">
                        <option value="tr">🇹🇷 TR</option>
                        <option value="en">🇬🇧 EN</option>
                    </select>

                    <!-- Notification Bell -->
                    <div class="relative">
                        <button @click="showNotifDropdown = !showNotifDropdown" class="bg-blue-900 dark:bg-slate-800 hover:bg-blue-800 p-2 rounded-lg relative transition">
                            🔔
                            <span x-show="unreadCount() > 0" class="absolute -top-1 -right-1 bg-rose-500 text-white text-xs w-5 h-5 rounded-full flex items-center justify-center font-bold" x-text="unreadCount()"></span>
                        </button>
                        <!-- Notification Dropdown -->
                        <div x-show="showNotifDropdown" @click.outside="showNotifDropdown = false" class="absolute right-0 mt-2 w-80 bg-white dark:bg-slate-900 rounded-xl shadow-2xl border border-slate-200 dark:border-slate-800 p-4 z-50 space-y-3" x-cloak>
                            <div class="flex justify-between items-center border-b border-slate-200 dark:border-slate-800 pb-2">
                                <h4 class="font-bold text-slate-900 dark:text-white text-sm" x-text="t('notifTitle')"></h4>
                                <button @click="markAllAsRead()" class="text-xs text-blue-600 dark:text-blue-400 hover:underline" x-text="t('readAll')"></button>
                            </div>
                            <div class="space-y-2 max-h-60 overflow-y-auto">
                                <template x-for="notif in notifications" :key="notif.id">
                                    <div :class="notif.read ? 'bg-slate-50 dark:bg-slate-800/40 opacity-75' : 'bg-blue-50 dark:bg-blue-950/40 border-l-2 border-blue-600'" class="p-2.5 rounded text-xs space-y-1">
                                        <p class="font-semibold text-slate-900 dark:text-white" x-text="notif.title"></p>
                                        <p class="text-slate-600 dark:text-slate-400" x-text="notif.desc"></p>
                                        <span class="text-[10px] text-slate-400" x-text="notif.time"></span>
                                    </div>
                                </template>
                            </div>
                        </div>
                    </div>

                    <!-- Dark/Light Mode Switcher -->
                    <button @click="darkMode = !darkMode" class="bg-blue-900 dark:bg-slate-800 hover:bg-blue-800 px-3 py-2 rounded-lg text-sm flex items-center space-x-2 transition">
                        <span x-text="darkMode ? '☀️' : '🌙'"></span>
                    </button>

                    <!-- Ayarlar Butonu (Çıkış Yap'ın Solunda) -->
                    <button @click="tab = 'settings'" class="bg-blue-900 dark:bg-slate-800 hover:bg-blue-800 text-white px-3 py-2 rounded-lg text-xs font-semibold transition" x-text="t('settings')"></button>

                    <!-- Logout Button -->
                    <button @click="logout()" class="bg-rose-600 hover:bg-rose-500 text-white px-3 py-2 rounded-lg text-xs font-semibold transition" x-text="t('logout')"></button>
                </div>
            </div>
        </header>

        <!-- Navigation Tabs -->
        <nav class="bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 shadow-sm">
            <div class="max-w-7xl mx-auto px-4 flex space-x-6 overflow-x-auto">
                <button @click="tab = 'dashboard'" :class="tab === 'dashboard' ? 'border-blue-600 text-blue-600 dark:text-blue-400' : 'border-transparent text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white'" class="py-4 px-1 border-b-2 font-medium text-sm whitespace-nowrap transition" x-text="t('navDashboard')"></button>
                <button @click="tab = 'offers'" :class="tab === 'offers' ? 'border-blue-600 text-blue-600 dark:text-blue-400' : 'border-transparent text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white'" class="py-4 px-1 border-b-2 font-medium text-sm whitespace-nowrap transition" x-text="t('navOffers')"></button>
                <button @click="tab = 'shipments'" :class="tab === 'shipments' ? 'border-blue-600 text-blue-600 dark:text-blue-400' : 'border-transparent text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white'" class="py-4 px-1 border-b-2 font-medium text-sm whitespace-nowrap transition" x-text="t('navShipments')"></button>
                <button x-show="userRole !== 'operation' && userRole !== 'client'" @click="tab = 'reports'" :class="tab === 'reports' ? 'border-blue-600 text-blue-600 dark:text-blue-400' : 'border-transparent text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white'" class="py-4 px-1 border-b-2 font-medium text-sm whitespace-nowrap transition" x-text="t('navReports')"></button>
                <button x-show="userRole !== 'operation' && userRole !== 'client'" @click="tab = 'finances'" :class="tab === 'finances' ? 'border-blue-600 text-blue-600 dark:text-blue-400' : 'border-transparent text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white'" class="py-4 px-1 border-b-2 font-medium text-sm whitespace-nowrap transition" x-text="t('navFinances')"></button>
                <button x-show="userRole === 'admin' || userRole === 'finance'" @click="tab = 'invoices'" :class="tab === 'invoices' ? 'border-blue-600 text-blue-600 dark:text-blue-400' : 'border-transparent text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white'" class="py-4 px-1 border-b-2 font-medium text-sm whitespace-nowrap transition" x-text="t('navInvoices')"></button>
            </div>
        </nav>

        <!-- Main Content Area -->
        <main class="max-w-7xl mx-auto px-4 py-8 flex-grow w-full space-y-6">
            
            <!-- TAB 1: DASHBOARD -->
            <div x-show="tab === 'dashboard'" class="space-y-6">
                <div class="bg-gradient-to-r from-blue-900 to-blue-950 rounded-2xl p-6 text-white shadow-lg flex flex-col md:flex-row justify-between items-center space-y-4 md:space-y-0">
                    <div>
                        <h2 class="text-2xl font-bold" x-text="userRole === 'client' ? t('dashWelcomeClient') : t('dashWelcomeFirm')"></h2>
                        <p class="text-blue-200 text-sm mt-1" x-text="t('dashSub')"></p>
                    </div>
                    <div class="flex space-x-3" x-show="userRole !== 'client'">
                        <button @click="showOfferModal = true" class="bg-blue-600 hover:bg-blue-500 px-4 py-2.5 rounded-xl font-medium text-sm shadow transition" x-text="t('btnNewOffer')"></button>
                        <button @click="showShipmentModal = true" class="bg-white text-blue-950 hover:bg-blue-50 px-4 py-2.5 rounded-xl font-medium text-sm shadow transition" x-text="t('btnNewShipment')"></button>
                    </div>
                </div>

                <!-- Stats Grid -->
                <div class="grid grid-cols-1 md:grid-cols-4 gap-6">
                    <div class="bg-white dark:bg-slate-900 p-6 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-800">
                        <p class="text-xs font-semibold text-slate-500 uppercase tracking-wider" x-text="t('statActive')"></p>
                        <p class="text-3xl font-bold text-slate-900 dark:text-white mt-2" x-text="filteredShipments().length"></p>
                    </div>
                    <div class="bg-white dark:bg-slate-900 p-6 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-800">
                        <p class="text-xs font-semibold text-slate-500 uppercase tracking-wider" x-text="t('statOffers')"></p>
                        <p class="text-3xl font-bold text-blue-600 dark:text-blue-400 mt-2" x-text="offers.length"></p>
                    </div>
                    <div class="bg-white dark:bg-slate-900 p-6 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-800">
                        <p class="text-xs font-semibold text-slate-500 uppercase tracking-wider" x-text="t('statOnRoad')"></p>
                        <p class="text-3xl font-bold text-amber-600 dark:text-amber-400 mt-2" x-text="filteredShipments().filter(s => s.status !== 'Teslim Edildi' && s.status !== 'Yükleme Bekliyor').length"></p>
                    </div>
                    <div x-show="userRole !== 'operation' && userRole !== 'client'" class="bg-white dark:bg-slate-900 p-6 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-800">
                        <p class="text-xs font-semibold text-slate-500 uppercase tracking-wider" x-text="t('statProfit')"></p>
                        <p class="text-3xl font-bold text-emerald-600 dark:text-emerald-400 mt-2" x-text="calculateTotalProfit() + ' EUR'"></p>
                    </div>
                </div>
            </div>

            <!-- TAB 2: OFFERS -->
            <div x-show="tab === 'offers'" class="space-y-6">
                <div class="flex justify-between items-center">
                    <h2 class="text-xl font-bold text-slate-900 dark:text-white" x-text="t('navOffers')"></h2>
                    <button x-show="userRole !== 'client'" @click="showOfferModal = true" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-xl text-sm font-medium shadow transition" x-text="t('btnNewOffer')"></button>
                </div>

                <div class="bg-white dark:bg-slate-900 shadow-sm rounded-2xl border border-slate-200 dark:border-slate-800 overflow-hidden">
                    <table class="min-w-full divide-y divide-slate-200 dark:divide-slate-800">
                        <thead class="bg-slate-50 dark:bg-slate-950">
                            <tr>
                                <th class="px-6 py-3 text-left text-xs font-semibold text-slate-500 uppercase" x-text="t('tblClient')"></th>
                                <th class="px-6 py-3 text-left text-xs font-semibold text-slate-500 uppercase" x-text="t('tblRoute')"></th>
                                <th class="px-6 py-3 text-left text-xs font-semibold text-slate-500 uppercase">Incoterms</th>
                                <th class="px-6 py-3 text-left text-xs font-semibold text-slate-500 uppercase" x-text="t('tblCargo')"></th>
                                <th class="px-6 py-3 text-left text-xs font-semibold text-slate-500 uppercase" x-text="t('tblAmount')"></th>
                                <th class="px-6 py-3 text-left text-xs font-semibold text-slate-500 uppercase" x-text="t('tblStatus')"></th>
                                <th class="px-6 py-3 text-right text-xs font-semibold text-slate-500 uppercase" x-text="t('tblAction')"></th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-slate-200 dark:divide-slate-800 text-sm">
                            <template x-for="offer in offers" :key="offer.id">
                                <tr>
                                    <td class="px-6 py-4 font-medium text-slate-900 dark:text-white">
                                        <span class="text-xs px-2 py-0.5 rounded mr-1 font-semibold bg-blue-100 text-blue-800 dark:bg-blue-950 dark:text-blue-300" x-text="offer.mode"></span>
                                        <div class="mt-1" x-text="offer.client"></div>
                                    </td>
                                    <td class="px-6 py-4 text-slate-600 dark:text-slate-300" x-text="offer.route"></td>
                                    <td class="px-6 py-4"><span class="bg-slate-100 dark:bg-slate-800 px-2 py-1 rounded text-xs font-mono font-bold" x-text="offer.incoterm"></span></td>
                                    <td class="px-6 py-4 text-slate-600 dark:text-slate-300" x-text="offer.cargo"></td>
                                    <td class="px-6 py-4 font-semibold text-slate-900 dark:text-white" x-text="offer.amount + ' ' + offer.currency"></td>
                                    <td class="px-6 py-4"><span class="text-xs px-2.5 py-1 rounded-full font-medium bg-emerald-100 text-emerald-800" x-text="offer.status"></span></td>
                                    <td class="px-6 py-4 text-right space-x-2">
                                        <button @click="downloadPDF(offer)" class="text-blue-600 hover:underline font-medium">📄 PDF</button>
                                    </td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- TAB 3: SHIPMENTS -->
            <div x-show="tab === 'shipments'" class="space-y-6">
                <div class="flex justify-between items-center">
                    <h2 class="text-xl font-bold text-slate-900 dark:text-white" x-text="t('navShipments')"></h2>
                    <button x-show="userRole !== 'client'" @click="showShipmentModal = true" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-xl text-sm font-medium shadow transition" x-text="t('btnNewShipment')"></button>
                </div>

                <div class="grid grid-cols-1 gap-6">
                    <template x-for="shipment in filteredShipments()" :key="shipment.id">
                        <div class="bg-white dark:bg-slate-900 p-6 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-800 space-y-4">
                            <div class="flex justify-between border-b border-slate-200 dark:border-slate-800 pb-3">
                                <div>
                                    <span class="text-xs bg-blue-100 text-blue-800 dark:bg-blue-950 dark:text-blue-300 px-2.5 py-1 rounded-full font-semibold" x-text="shipment.code"></span>
                                    <h3 class="text-lg font-bold text-slate-900 dark:text-white mt-1" x-text="shipment.client + ' | ' + shipment.route"></h3>
                                </div>
                                <span class="text-xs px-3 py-1 rounded-full font-semibold bg-amber-100 text-amber-800" x-text="shipment.status"></span>
                            </div>
                        </div>
                    </template>
                </div>
            </div>

            <!-- TAB 4: REPORTS -->
            <div x-show="tab === 'reports' && userRole !== 'operation' && userRole !== 'client'" class="space-y-6">
                <h2 class="text-xl font-bold text-slate-900 dark:text-white" x-text="t('navReports')"></h2>
                <div class="bg-white dark:bg-slate-900 p-6 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-800">
                    <p class="text-sm text-slate-500">BI Raporlama paneli aktif.</p>
                </div>
            </div>

            <!-- TAB 5: FINANCES -->
            <div x-show="tab === 'finances' && userRole !== 'operation' && userRole !== 'client'" class="space-y-6">
                <h2 class="text-xl font-bold text-slate-900 dark:text-white" x-text="t('navFinances')"></h2>
                <div class="bg-white dark:bg-slate-900 p-6 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-800">
                    <p class="text-sm text-slate-500">Masraf ve kârlılık analizi.</p>
                </div>
            </div>

            <!-- TAB 6: INVOICES -->
            <div x-show="tab === 'invoices' && (userRole === 'admin' || userRole === 'finance')" class="space-y-6">
                <h2 class="text-xl font-bold text-slate-900 dark:text-white" x-text="t('navInvoices')"></h2>
                <div class="bg-white dark:bg-slate-900 p-6 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-800">
                    <p class="text-sm text-slate-500">Ön muhasebe ve e-fatura modülü.</p>
                </div>
            </div>

            <!-- TAB 7: SETTINGS & PROFILE -->
            <div x-show="tab === 'settings'" class="space-y-6">
                <h2 class="text-xl font-bold text-slate-900 dark:text-white" x-text="t('settingsTitle')"></h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="bg-white dark:bg-slate-900 p-6 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-800 space-y-4">
                        <h3 class="font-bold text-slate-900 dark:text-white border-b border-slate-200 dark:border-slate-800 pb-3" x-text="t('profileTitle')"></h3>
                        <div class="space-y-3 text-sm">
                            <div>
                                <label class="text-xs text-slate-500" x-text="t('nameLabel')"></label>
                                <input type="text" value="Ahmet Yönetici" class="w-full mt-1 p-2.5 border rounded-xl dark:bg-slate-800 dark:border-slate-700 text-sm">
                            </div>
                            <button @click="alert('Kaydedildi')" class="bg-blue-600 text-white px-4 py-2 rounded-xl text-xs font-semibold" x-text="t('saveBtn')"></button>
                        </div>
                    </div>
                </div>
            </div>

        </main>
    </div>

    <!-- MODAL: YENİ TEKLİF -->
    <div x-show="showOfferModal" class="fixed inset-0 bg-slate-950/60 backdrop-blur-sm flex items-center justify-center p-4 z-50" x-cloak>
        <div class="bg-white dark:bg-slate-900 rounded-2xl p-6 max-w-md w-full space-y-4 shadow-2xl border border-slate-200 dark:border-slate-800">
            <h3 class="text-lg font-bold text-slate-900 dark:text-white" x-text="t('modalOfferTitle')"></h3>
            <select x-model="newOffer.mode" class="w-full p-2.5 border rounded-xl dark:bg-slate-800 dark:border-slate-700 dark:text-white text-sm">
                <option value="Karayolu">Karayolu</option>
                <option value="Denizyolu">Denizyolu</option>
                <option value="Havayolu">Havayolu</option>
            </select>
            <input x-model="newOffer.client" type="text" placeholder="Müşteri Adı" class="w-full p-2.5 border rounded-xl dark:bg-slate-800 dark:border-slate-700 dark:text-white text-sm">
            <input x-model="newOffer.route" type="text" placeholder="Güzergah" class="w-full p-2.5 border rounded-xl dark:bg-slate-800 dark:border-slate-700 dark:text-white text-sm">
            <input x-model="newOffer.amount" type="number" placeholder="Tutar (EUR)" class="w-full p-2.5 border rounded-xl dark:bg-slate-800 dark:border-slate-700 dark:text-white text-sm">
            <div class="flex justify-end space-x-2 pt-2">
                <button @click="showOfferModal = false" class="px-4 py-2 text-slate-600 text-sm" x-text="t('cancelBtn')"></button>
                <button @click="addOffer()" class="bg-blue-600 text-white px-4 py-2 rounded-xl text-sm font-medium" x-text="t('saveBtn')"></button>
            </div>
        </div>
    </div>

    <!-- MODAL: YENİ SEVKİYAT -->
    <div x-show="showShipmentModal" class="fixed inset-0 bg-slate-950/60 backdrop-blur-sm flex items-center justify-center p-4 z-50" x-cloak>
        <div class="bg-white dark:bg-slate-900 rounded-2xl p-6 max-w-md w-full space-y-4 shadow-2xl border border-slate-200 dark:border-slate-800">
            <h3 class="text-lg font-bold text-slate-900 dark:text-white" x-text="t('modalShipmentTitle')"></h3>
            <input x-model="newShipment.client" type="text" placeholder="Müşteri Adı" class="w-full p-2.5 border rounded-xl dark:bg-slate-800 dark:border-slate-700 dark:text-white text-sm">
            <input x-model="newShipment.route" type="text" placeholder="Güzergah" class="w-full p-2.5 border rounded-xl dark:bg-slate-800 dark:border-slate-700 dark:text-white text-sm">
            <div class="flex justify-end space-x-2 pt-2">
                <button @click="showShipmentModal = false" class="px-4 py-2 text-slate-600 text-sm" x-text="t('cancelBtn')"></button>
                <button @click="addShipment()" class="bg-blue-600 text-white px-4 py-2 rounded-xl text-sm font-medium" x-text="t('startBtn')"></button>
            </div>
        </div>
    </div>

    <!-- Hidden PDF Template -->
    <div id="pdf-template" class="hidden p-8 bg-white text-slate-900">
